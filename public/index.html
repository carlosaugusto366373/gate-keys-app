<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QZZ Community — Downloads & Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --vermelho: #e11d2a;
    --vermelho-escuro: #8b0f18;
    --vermelho-brilho: #ff2d3d;
    --preto: #0a0a0a;
    --preto-card: #121214;
    --preto-borda: #26262b;
    --cinza-txt: #8a8a92;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--preto);
    color: #fff;
    min-height: 100vh;
    padding: 0;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(225, 29, 42, 0.15) 0%, transparent 50%),
      linear-gradient(rgba(225, 29, 42, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(225, 29, 42, 0.04) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
  }

  /* Header */
  .header {
    background: rgba(10,10,10,.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(225, 29, 42, 0.25);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    color: #fff;
  }
  .logo-badge {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 900; font-size: 16px;
    box-shadow: 0 0 20px rgba(225, 29, 42, 0.6);
  }
  .logo span { color: var(--vermelho-brilho); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    background: #121214;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--preto-borda);
  }
  .tab {
    padding: 9px 20px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--cinza-txt);
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    letter-spacing: .5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: .2s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    color: #fff;
    box-shadow: 0 0 20px rgba(225, 29, 42, 0.5);
  }
  .tab:not(.active):hover { color: #ccc; }

  /* Container */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  /* Hero */
  .hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .hero-badge {
    display: inline-block;
    padding: 6px 16px;
    background: rgba(225, 29, 42, 0.12);
    border: 1px solid rgba(225, 29, 42, 0.4);
    border-radius: 20px;
    font-size: 11px;
    color: var(--vermelho-brilho);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, var(--vermelho-brilho) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .hero .linha {
    width: 60px; height: 3px;
    background: var(--vermelho);
    margin: 12px auto;
    border-radius: 2px;
    box-shadow: 0 0 20px var(--vermelho);
  }
  .hero p {
    color: var(--cinza-txt);
    font-size: 14px;
    max-width: 420px;
    margin: 0 auto;
  }

  /* Card */
  .card {
    background: var(--preto-card);
    border: 1px solid var(--preto-borda);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 40px rgba(225, 29, 42, 0.08);
  }

  .progresso {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--cinza-txt);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .progresso .num { color: var(--vermelho-brilho); font-weight: 800; font-family: 'Rajdhani', sans-serif; font-size: 14px; }

  .barra {
    width: 100%; height: 4px;
    background: #1a1a1e;
    border-radius: 4px; overflow: hidden;
    margin-bottom: 22px;
  }
  .barra-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--vermelho-escuro), var(--vermelho-brilho));
    transition: width .4s ease;
    box-shadow: 0 0 12px var(--vermelho);
  }

  /* Step */
  .step {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; border-radius: 12px;
    background: #0e0e10;
    border: 1px solid var(--preto-borda);
    margin-bottom: 10px;
    transition: .25s;
    cursor: pointer;
    user-select: none;
  }
  .step.locked { opacity: .35; pointer-events: none; }
  .step.done {
    background: linear-gradient(135deg, rgba(225, 29, 42, 0.12), rgba(225, 29, 42, 0.03));
    border-color: var(--vermelho);
    box-shadow: 0 0 20px rgba(225, 29, 42, 0.15) inset;
  }
  .step.done .check {
    background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    color: #fff;
    box-shadow: 0 0 12px var(--vermelho);
  }
  .step:not(.done):not(.locked):hover {
    border-color: var(--vermelho-escuro);
    background: #14141a;
  }
  .check {
    width: 32px; height: 32px; border-radius: 8px;
    background: #1a1a1e;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px; font-weight: 800;
    flex-shrink: 0;
    transition: .25s;
    color: #666;
  }
  .step-txt { font-size: 14px; line-height: 1.4; }
  .step-txt b { color: var(--vermelho-brilho); font-weight: 800; }

  /* Botão */
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    color: #fff;
    font-weight: 800;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 16px;
    transition: .2s;
    box-shadow: 0 0 30px rgba(225, 29, 42, 0.35);
  }
  .btn:disabled {
    background: #1a1a1e;
    color: #4a4a52;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn:not(:disabled):hover {
    transform: translateY(-1px);
    box-shadow: 0 0 40px rgba(225, 29, 42, 0.6);
  }

  /* Resultado */
  .resultado {
    margin-top: 20px;
    padding: 22px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(225, 29, 42, 0.12), rgba(225, 29, 42, 0.02));
    border: 1px solid var(--vermelho);
    text-align: center;
    display: none;
    box-shadow: 0 0 30px rgba(225, 29, 42, 0.15);
    animation: aparecer .4s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .resultado .titulo-res {
    font-size: 11px;
    color: var(--vermelho-brilho);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .resultado code {
    display: block;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff;
    padding: 14px;
    background: #0a0a0c;
    border-radius: 10px;
    border: 1px solid var(--preto-borda);
    word-break: break-all;
    margin-bottom: 14px;
  }
  .copy {
    background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: 800;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 13px;
    transition: .2s;
  }
  .copy:hover { filter: brightness(1.15); }

  /* Downloads */
  .download-btn {
    display: block;
    background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    color: #fff;
    text-decoration: none;
    padding: 16px 22px;
    border-radius: 12px;
    font-weight: 800;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 15px;
    margin-bottom: 10px;
    transition: .2s;
    text-align: center;
    box-shadow: 0 0 20px rgba(225, 29, 42, 0.3);
  }
  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(225, 29, 42, 0.6);
  }

  /* Aviso já resgatou */
  .aviso-resgatou {
    padding: 20px;
    border-radius: 12px;
    background: rgba(225, 29, 42, 0.08);
    border: 1px solid rgba(225, 29, 42, 0.4);
    text-align: center;
    color: #ddd;
    font-size: 14px;
  }
  .aviso-resgatou strong { color: var(--vermelho-brilho); display: block; margin-bottom: 6px; font-size: 15px; }

  .loading {
    text-align: center; color: #666; padding: 80px 0;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 13px;
  }

  .footer {
    text-align: center;
    padding: 30px 20px;
    color: #444;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .footer span { color: var(--vermelho-brilho); font-weight: 700; }

  /* Responsivo */
  @media (max-width: 640px) {
    .header { padding: 12px 16px; flex-wrap: wrap; }
    .tabs { width: 100%; order: 3; }
    .container { padding: 24px 14px 40px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-badge">QZZ</div>
    <div>QZZ <span>COMMUNITY</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabKeys" onclick="trocarAba('keys')">🔑 Keys</button>
    <button class="tab" id="tabDownloads" onclick="trocarAba('downloads')">📦 Downloads</button>
  </div>
</header>

<!-- CONTEÚDO -->
<div class="container">
  <div id="loading" class="loading">Carregando...</div>

  <div id="conteudo" style="display:none">
    <div class="hero">
      <div class="hero-badge" id="heroBadge">DESTAQUES DA LOJA</div>
      <h1 id="heroTitulo">Produtos Mais Vendidos</h1>
      <div class="linha"></div>
      <p id="heroSub">Complete as etapas pra liberar</p>
    </div>

    <div class="card" id="cardConteudo"></div>
  </div>
</div>

<div class="footer">QZZ <span>COMMUNITY</span> © 2026</div>

<script>
  let config = null;
  let abaAtual = 'keys';
  const estado = { keys: { atual: 1, jaResgatou: false }, downloads: { atual: 1, jaResgatou: false } };

  async function carregar() {
    try {
      const res = await fetch('/api/config');
      config = await res.json();
      // Verifica status do IP em paralelo
      const [sK, sD] = await Promise.all([
        fetch('/api/status/keys').then(r => r.json()),
        fetch('/api/status/downloads').then(r => r.json())
      ]);
      if (sK.resgatou) estado.keys.jaResgatou = true;
      if (sD.resgatou) estado.downloads.jaResgatou = true;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('conteudo').style.display = 'block';
      render();
    } catch (e) {
      document.getElementById('loading').textContent = '❌ Erro ao carregar. Recarregue.';
    }
  }

  function trocarAba(aba) {
    abaAtual = aba;
    document.getElementById('tabKeys').classList.toggle('active', aba === 'keys');
    document.getElementById('tabDownloads').classList.toggle('active', aba === 'downloads');
    render();
  }

  function render() {
    const card = document.getElementById('cardConteudo');
    const heroBadge = document.getElementById('heroBadge');
    const heroTitulo = document.getElementById('heroTitulo');
    const heroSub = document.getElementById('heroSub');

    if (abaAtual === 'keys') {
      heroBadge.textContent = 'RESGATE DE KEYS';
      heroTitulo.textContent = config.titulo ? config.titulo.replace(/[🔑📦]\s?/g, '').toUpperCase() : 'RESGATAR KEY';
      heroSub.textContent = config.subtitulo || 'Complete as etapas pra liberar';

      if (estado.keys.jaResgatou) {
        card.innerHTML = `
          <div class="aviso-resgatou">
            <strong>⚠️ Você já resgatou uma key</strong>
            Só é permitida 1 key por pessoa (por IP). Se você já pegou a sua, use ela.
          </div>
        `;
        return;
      }

      const atual = estado.keys.atual;
      const total = config.etapas.length;
      card.innerHTML = `
        <div class="progresso">
          <span>Progresso</span>
          <span class="num">${Math.min(atual, total)} / ${total}</span>
        </div>
        <div class="barra"><div class="barra-fill" style="width:${((atual - 1) / total) * 100}%"></div></div>
        <div id="etapasBox"></div>
        <button class="btn" id="btnAcao" disabled>🔒 Complete as etapas acima</button>
        <div class="resultado" id="resultadoBox">
          <div class="titulo-res">Sua Key</div>
          <code id="valorTxt">XXXX-XXXX-XXXX-XXXX</code>
          <button class="copy" onclick="copiar('valorTxt', event)">Copiar Key</button>
        </div>
      `;
      renderEtapas(config.etapas, 'keys');
    } else {
      const d = config.downloads || { titulo: '📦 Downloads', subtitulo: '', etapas: [], itens: [] };
      heroBadge.textContent = 'ÁREA DE DOWNLOADS';
      heroTitulo.textContent = 'DOWNLOADS LIBERADOS';
      heroSub.textContent = d.subtitulo || 'Complete as etapas pra liberar';

      if (estado.downloads.jaResgatou) {
        // Já resgatou — libera direto
        card.innerHTML = `
          <div class="resultado" style="display:block; margin-top:0">
            <div class="titulo-res">Downloads Liberados</div>
            <div id="downloadsLista"></div>
          </div>
        `;
        renderDownloads(d.itens);
        return;
      }

      const atual = estado.downloads.atual;
      const total = d.etapas.length;
      card.innerHTML = `
        <div class="progresso">
          <span>Progresso</span>
          <span class="num">${Math.min(atual, total)} / ${total}</span>
        </div>
        <div class="barra"><div class="barra-fill" style="width:${((atual - 1) / total) * 100}%"></div></div>
        <div id="etapasBox"></div>
        <button class="btn" id="btnAcao" disabled>🔒 Complete as etapas acima</button>
        <div class="resultado" id="resultadoBox">
          <div class="titulo-res">Downloads Liberados</div>
          <div id="downloadsLista"></div>
        </div>
      `;
      renderEtapas(d.etapas, 'downloads');
    }
  }

  function renderEtapas(etapas, tipo) {
    const box = document.getElementById('etapasBox');
    box.innerHTML = '';
    etapas.forEach((et, i) => {
      const stepNum = i + 1;
      const jaFeito = estado[tipo].atual > stepNum;
      const liberado = estado[tipo].atual === stepNum;
      const div = document.createElement('div');
      div.className = 'step' + (jaFeito ? ' done' : (liberado ? '' : ' locked'));
      div.innerHTML = `
        <div class="check">${jaFeito ? '✓' : stepNum}</div>
        <div class="step-txt">${et.texto}</div>
      `;
      div.onclick = () => clicarEtapa(et.link, stepNum, tipo);
      box.appendChild(div);
    });
    atualizarBotao(tipo);
  }

  function clicarEtapa(link, stepNum, tipo) {
    if (estado[tipo].atual !== stepNum) return;
    window.open(link, '_blank');
    estado[tipo].atual++;
    render();
  }

  function atualizarBotao(tipo) {
    const total = tipo === 'keys'
      ? config.etapas.length
      : (config.downloads?.etapas?.length || 0);
    const btn = document.getElementById('btnAcao');
    if (!btn) return;
    if (estado[tipo].atual > total) {
      btn.disabled = false;
      btn.textContent = tipo === 'keys'
        ? (config.mensagemFinal || '🎁 Resgatar minha key')
        : '🎁 Liberar downloads';
      btn.onclick = () => resgatar(tipo);
    }
  }

  async function resgatar(tipo) {
    const btn = document.getElementById('btnAcao');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Processando...'; }

    try {
      const url = tipo === 'keys' ? '/api/resgatar/key' : '/api/resgatar/downloads';
      const res = await fetch(url, { method: 'POST' });
      const data = await res.json();

      if (res.status === 409) {
        // Já resgatou
        if (tipo === 'keys') {
          estado.keys.jaResgatou = true;
          document.getElementById('valorTxt').textContent = data.valor;
          document.getElementById('resultadoBox').style.display = 'block';
          if (btn) { btn.textContent = '⚠️ Você já tinha resgatado'; }
        }
        return;
      }

      if (!res.ok) throw new Error(data.erro || 'Erro');

      if (tipo === 'keys') {
        estado.keys.jaResgatou = true;
        document.getElementById('valorTxt').textContent = data.valor;
        document.getElementById('resultadoBox').style.display = 'block';
        if (btn) { btn.textContent = '✅ Key liberada'; }
      } else {
        estado.downloads.jaResgatou = true;
        renderDownloads(data.itens);
        document.getElementById('resultadoBox').style.display = 'block';
        if (btn) { btn.textContent = '✅ Downloads liberados'; }
      }
    } catch (e) {
      if (btn) { btn.textContent = '❌ Erro. Tente novamente.'; btn.disabled = false; }
    }
  }

  function renderDownloads(itens) {
    const box = document.getElementById('downloadsLista');
    if (!box) return;
    if (!itens || !itens.length) {
      box.innerHTML = '<p style="color:#888">Nenhum download cadastrado.</p>';
      return;
    }
    box.innerHTML = itens.map(it =>
      `<a class="download-btn" href="${it.link}" target="_blank" rel="noopener">⬇️ ${it.nome}</a>`
    ).join('');
  }

  function copiar(id, e) {
    const txt = document.getElementById(id).textContent;
    navigator.clipboard.writeText(txt);
    e.target.textContent = 'Copiado!';
    setTimeout(() => e.target.textContent = 'Copiar Key', 1500);
  }

  carregar();
</script>
</body>
</html>
