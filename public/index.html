
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>QZZ Community Download</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

* {
  box-sizing: border-box;
  font-family: 'Inter', system-ui, sans-serif;
}

html {
  min-height: 100%;
  background: #050505;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 20px;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% -20%, rgba(220,38,38,.15), transparent 60%),
    radial-gradient(circle at 10% 90%, rgba(220,38,38,.05), transparent 40%),
    #050505;
  color: #fff;
}

.card {
  width: 100%;
  max-width: 460px;
  min-width: 0;
  margin: auto;
  padding: 30px;
  background: #0a0a0a;
  border: 1px solid #1f1f1f;
  border-top: 1px solid rgba(220,38,38,.5);
  border-radius: 16px;
  box-shadow:
    0 30px 60px -15px rgba(0,0,0,.9),
    0 0 40px -10px rgba(220,38,38,.15);
  animation: slideUp .6s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0 0 8px;
  color: #ef4444;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -.5px;
  line-height: 1.2;
  text-transform: uppercase;
  text-shadow: 0 0 20px rgba(239,68,68,.3);
}

.sub {
  margin: 0 0 24px;
  color: #a1a1aa;
  font-size: 14px;
  line-height: 1.5;
}

.progress-container {
  margin-bottom: 25px;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  color: #71717a;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.progress-bar {
  width: 100%;
  height: 6px;
  overflow: hidden;
  border-radius: 10px;
  background: #1f1f1f;
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: 10px;
  background: #dc2626;
  box-shadow: 0 0 10px rgba(220,38,38,.5);
  transition: width .4s ease, background .3s ease;
}

.step {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 15px;
  margin-bottom: 11px;
  border: 1px solid #27272a;
  border-radius: 12px;
  background: #111;
  cursor: pointer;
  user-select: none;
  transition: .25s ease;
}

.step:not(.locked):not(.done):hover {
  background: #191919;
  border-color: #dc2626;
  transform: translateX(3px);
  box-shadow: 0 4px 20px rgba(220,38,38,.12);
}

.step.locked {
  opacity: .3;
  pointer-events: none;
  filter: grayscale(1);
}

.step.done {
  background: #0f0f0f;
  border-color: rgba(34,197,94,.35);
  cursor: default;
}

.check {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid #3f3f46;
  border-radius: 8px;
  background: #1f1f1f;
  color: #a1a1aa;
  font-size: 13px;
  font-weight: 800;
}

.step.done .check {
  color: #000;
  background: #22c55e;
  border-color: #22c55e;
}

.step-txt {
  min-width: 0;
  color: #d4d4d8;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.step-txt b,
.step-txt strong {
  color: #fff;
  font-weight: 700;
}

.step.done .step-txt {
  color: #a1a1aa;
  text-decoration: line-through;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #27272a;
  border-radius: 12px;
  background: #111;
  color: #52525b;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  cursor: not-allowed;
  transition: .3s ease;
}

.btn:not(:disabled) {
  border-color: #ef4444;
  background: linear-gradient(135deg,#dc2626,#991b1b);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(220,38,38,.4);
}

.btn:not(:disabled):hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg,#ef4444,#dc2626);
}

.loading {
  padding: 25px 0;
  color: #ef4444;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: .4; }
}

.error {
  color: #ef4444;
  font-size: 13px;
  text-align: center;
  line-height: 1.5;
}

@media(max-width:480px) {
  body {
    padding: 16px;
  }

  .card {
    padding: 22px;
    max-width: 100%;
  }

  h1 {
    font-size: 20px;
  }
}

@media(max-width:350px) {
  .card {
    padding: 17px;
  }

  .step {
    padding: 12px;
  }
}
</style>
</head>

<body>

<main class="card">

  <div id="loading" class="loading">
    CARREGANDO...
  </div>

  <section id="conteudo" hidden>

    <h1>QZZ COMMUNITY DOWNLOAD</h1>

    <p class="sub">
      Complete as etapas abaixo para liberar o download.
    </p>

    <div class="progress-container">
      <div class="progress-text">
        <span>Progresso</span>
        <span id="progTxt">0%</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progFill"></div>
      </div>
    </div>

    <div id="etapasBox"></div>

    <button class="btn" id="btnDownload" disabled>
      <span id="btnIcon">🔒</span>
      <span id="btnText">Complete as etapas</span>
    </button>

  </section>

</main>

<script>
'use strict';

let config = null;
let currentStep = 1;
let TOTAL = 0;

const TEMPO_MINIMO = 30000;

let missaoPendente = null;
let inicioMissao = 0;
let avisoRetorno = false;

// Carregamento da configuração.
async function carregar() {
  try {
    const res = await fetch('/api/config', {
      cache: 'no-store'
    });

    if (!res.ok) {
      throw new Error('Erro ao carregar configuração');
    }

    config = await res.json();

    if (!Array.isArray(config.etapas)) {
      throw new Error('Configuração de etapas inválida');
    }

    TOTAL = config.etapas.length;

    document.getElementById('loading').hidden = true;
    document.getElementById('conteudo').hidden = false;

    render();

  } catch (error) {
    const loading = document.getElementById('loading');
    loading.classList.add('error');
    loading.textContent = '❌ Erro ao carregar. Atualize a página.';
  }
}

// Insere somente formatação HTML permitida.
function inserirTextoSeguro(container, html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(
    String(html ?? ''),
    'text/html'
  );

  const permitidas = [
    'B', 'STRONG', 'I', 'EM', 'U', 'BR'
  ];

  function copiar(origem, destino) {
    for (const node of origem.childNodes) {

      if (node.nodeType === Node.TEXT_NODE) {
        destino.appendChild(
          document.createTextNode(node.textContent)
        );
        continue;
      }

      if (node.nodeType !== Node.ELEMENT_NODE) continue;

      if (permitidas.includes(node.tagName)) {
        const novo = document.createElement(
          node.tagName.toLowerCase()
        );

        copiar(node, novo);
        destino.appendChild(novo);

      } else {
        copiar(node, destino);
      }
    }
  }

  copiar(doc.body, container);
}

// Montagem das missões.
function render() {
  const box = document.getElementById('etapasBox');
  box.replaceChildren();

  config.etapas.forEach((et, i) => {

    const div = document.createElement('div');

    div.className = 'step' + (i === 0 ? '' : ' locked');
    div.dataset.step = String(i + 1);

    const check = document.createElement('div');
    check.className = 'check';
    check.textContent = String(i + 1);

    const txt = document.createElement('div');
    txt.className = 'step-txt';

    inserirTextoSeguro(txt, et.texto);

    div.append(check, txt);

    div.addEventListener('click', () => {
      openLink(div, et.link, i + 1);
    });

    box.appendChild(div);
  });

  atualizarProgresso();
}

// Barra de progresso.
function atualizarProgresso() {
  const pct = TOTAL > 0
    ? Math.round(((currentStep - 1) / TOTAL) * 100)
    : 100;

  const fill = document.getElementById('progFill');

  fill.style.width = pct + '%';

  document.getElementById('progTxt').textContent =
    pct + '%';

  if (pct === 100) {
    fill.style.background = '#22c55e';
    fill.style.boxShadow =
      '0 0 10px rgba(34,197,94,.5)';
  }
}

// Abrir missão e verificar tempo.
function openLink(el, url, step) {

  if (step !== currentStep) return;

  // Primeira abertura.
  if (missaoPendente !== step) {

    let destino;

    try {
      destino = new URL(url, window.location.origin);

      if (!['http:', 'https:'].includes(destino.protocol)) {
        throw new Error('URL inválida');
      }

    } catch (error) {
      alert('Link da missão inválido.');
      return;
    }

    // Abre a missão em outra aba.
    const link = document.createElement('a');

    link.href = destino.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';

    document.body.appendChild(link);
    link.click();
    link.remove();

    missaoPendente = step;
    inicioMissao = Date.now();
    avisoRetorno = false;

    return;
  }

  // Verificação dos 30 segundos.
  const decorrido = Date.now() - inicioMissao;

  if (decorrido < TEMPO_MINIMO) {
    alert(
      '⚠️ VOCÊ AINDA NÃO FEZ ESSA MISSÃO!\n\n' +
      'Conclua a tarefa antes de continuar.'
    );
    return;
  }

  // Confirmação da etapa pelo usuário.
  el.classList.add('done');
  el.querySelector('.check').textContent = '✓';

  missaoPendente = null;
  inicioMissao = 0;
  avisoRetorno = false;

  currentStep++;

  atualizarProgresso();

  // Desbloquear próxima missão.
  const proxima = document.querySelector(
    `.step[data-step="${currentStep}"]`
  );

  if (proxima) {
    proxima.classList.remove('locked');
  }

  // Todas as missões concluídas.
  if (currentStep > TOTAL) {
    liberarDownload();
  }
}

// Aviso quando o usuário volta à página.
function verificarRetorno() {

  if (
    missaoPendente === null ||
    document.visibilityState !== 'visible' ||
    avisoRetorno
  ) {
    return;
  }

  avisoRetorno = true;

  alert(
    '⚠️ VOCÊ AINDA NÃO FEZ ESSA MISSÃO!\n\n' +
    'Conclua a tarefa e depois volte para continuar.'
  );
}

document.addEventListener(
  'visibilitychange',
  verificarRetorno
);

// Download.
function liberarDownload() {
  const btn = document.getElementById('btnDownload');

  btn.disabled = false;

  document.getElementById('btnIcon').textContent = '⬇️';

  document.getElementById('btnText').textContent =
    config.mensagemFinal || 'BAIXAR APK';
}

document.getElementById('btnDownload').addEventListener(
  'click',
  () => {

    if (currentStep <= TOTAL) return;

    const url = config.downloadUrl || config.linkDownload;

    try {
      const destino = new URL(url);

      if (!['http:', 'https:'].includes(destino.protocol)) {
        throw new Error('URL inválida');
      }

      window.location.href = destino.href;

    } catch (error) {
      alert('Link de download inválido.');
    }
  }
);

carregar();

</script>

</body>
</html>
