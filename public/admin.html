<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { background: #0f0f13; color: #fff; margin: 0; padding: 24px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
  .box {
    background: #1a1a22; border: 1px solid #2a2a35;
    border-radius: 14px; padding: 20px; margin-bottom: 18px;
  }
  .box h2 { font-size: 15px; margin: 0 0 14px; color: #60a5fa; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
  input, textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2a2a35; background: #12121a; color: #fff;
    font-size: 14px; margin-bottom: 12px; font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
  textarea { min-height: 90px; resize: vertical; font-family: monospace; }
  .row { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
  .row .num {
    background: #2a2a35; border-radius: 8px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #888;
  }
  button {
    padding: 10px 18px; border-radius: 10px; border: none;
    background: #3b82f6; color: #fff; font-weight: 700;
    cursor: pointer; font-size: 14px;
  }
  button:hover { background: #2563eb; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.ghost { background: #2a2a35; }
  button.ghost:hover { background: #3a3a45; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #22c55e; color: #000; padding: 12px 20px; border-radius: 10px;
    font-weight: 700; opacity: 0; transition: .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.erro { background: #dc2626; color: #fff; }
  .header-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  small { color: #666; font-size: 12px; display: block; margin-top: -6px; margin-bottom: 12px; }

  /* Login */
  #loginBox {
    max-width: 360px; margin: 80px auto; text-align: center;
  }
  #loginBox input { text-align: center; }
</style>
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<div id="loginBox" style="display:none">
  <h1>🔒 Painel Admin</h1>
  <p class="sub">Digite a senha de administrador</p>
  <input type="password" id="senhaInput" placeholder="Senha" onkeydown="if(event.key==='Enter')fazerLogin()">
  <button onclick="fazerLogin()" style="width:100%">Entrar</button>
</div>

<!-- ===== PAINEL ===== -->
<div class="wrap" id="painel" style="display:none">
  <h1>🎛️ Painel Admin</h1>
  <p class="sub">Edite tudo aqui. As mudanças aparecem na hora pra todo mundo.</p>

  <div class="header-actions">
    <button onclick="abrirPublico()" class="ghost">👁️ Ver página pública</button>
    <button onclick="exportar()" class="ghost">⬇️ Exportar config</button>
    <button onclick="importar()" class="ghost">⬆️ Importar config</button>
    <button onclick="sair()" class="danger">🚪 Sair</button>
  </div>

  <div class="box">
    <h2>📝 Geral</h2>
    <label>Título da página</label>
    <input id="titulo" placeholder="🔑 Resgatar Key">
    <label>Subtítulo</label>
    <input id="subtitulo" placeholder="Complete as etapas na ordem...">
    <label>Mensagem final (depois de completar)</label>
    <input id="mensagemFinal" placeholder="✅ Tudo certo! Clique para resgatar.">
  </div>

  <div class="box">
    <h2>🔗 Etapas</h2>
    <div id="etapasContainer"></div>
    <div class="actions">
      <button onclick="adicionarEtapa()" class="ghost">➕ Adicionar etapa</button>
    </div>
  </div>

  <div class="box">
    <h2>🔑 Keys (uma por linha)</h2>
    <textarea id="keys" placeholder="A1B2-C3D4-E5F6-G7H8&#10;H8G7-F6E5-D4C3-B2A1"></textarea>
    <small>Uma key por linha. O sistema sorteia uma aleatória a cada resgate.</small>
  </div>

  <button onclick="salvar()" style="width:100%; padding:14px; font-size:15px;">💾 Salvar tudo</button>
</div>

<div class="toast" id="toast">Salvo com sucesso!</div>

<script>
  let config = null;
  let senhaAdmin = '';

  // ===== LOGIN =====
  async function fazerLogin() {
    const senha = document.getElementById('senhaInput').value;
    if (!senha) return;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha })
      });
      if (!res.ok) throw new Error('Senha incorreta');
      senhaAdmin = senha;
      sessionStorage.setItem('admin_senha', senha);
      entrarNoPainel();
    } catch (e) {
      toast('Senha incorreta', true);
    }
  }

  function sair() {
    sessionStorage.removeItem('admin_senha');
    senhaAdmin = '';
    document.getElementById('painel').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('senhaInput').value = '';
  }

  async function entrarNoPainel() {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    await carregarConfig();
  }

  // ===== CARREGAR CONFIG =====
  async function carregarConfig() {
    try {
      const res = await fetch('/api/config');
      config = await res.json();
      render();
    } catch (e) {
      toast('Erro ao carregar config', true);
    }
  }

  function render() {
    document.getElementById('titulo').value = config.titulo || '';
    document.getElementById('subtitulo').value = config.subtitulo || '';
    document.getElementById('mensagemFinal').value = config.mensagemFinal || '';
    document.getElementById('keys').value = (config.keys || []).join('\n');
    renderEtapas();
  }

  function renderEtapas() {
    const box = document.getElementById('etapasContainer');
    box.innerHTML = '';
    config.etapas.forEach((et, i) => {
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML = `
        <div class="num">${i + 1}</div>
        <div>
          <label>Texto (aceita HTML como &lt;b&gt;)</label>
          <input value="${escapeAttr(et.texto)}" oninput="mudarEtapa(${i}, 'texto', this.value)">
          <label>Link</label>
          <input value="${escapeAttr(et.link)}" oninput="mudarEtapa(${i}, 'link', this.value)">
          <button class="danger" style="margin-bottom:12px" onclick="removerEtapa(${i})">🗑️ Remover etapa</button>
        </div>
      `;
      box.appendChild(div);
    });
  }

  function escapeAttr(s) {
    return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function mudarEtapa(i, campo, valor) {
    config.etapas[i][campo] = valor;
  }

  function adicionarEtapa() {
    if (!config.etapas) config.etapas = [];
    config.etapas.push({ texto: 'Nova etapa', link: 'https://' });
    renderEtapas();
  }

  function removerEtapa(i) {
    if (config.etapas.length <= 1) return alert('Precisa ter pelo menos 1 etapa.');
    config.etapas.splice(i, 1);
    renderEtapas();
  }

  // ===== SALVAR NO SERVIDOR =====
  async function salvar() {
    config.titulo = document.getElementById('titulo').value;
    config.subtitulo = document.getElementById('subtitulo').value;
    config.mensagemFinal = document.getElementById('mensagemFinal').value;
    config.keys = document.getElementById('keys').value
      .split('\n').map(k => k.trim()).filter(Boolean);

    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-password': senhaAdmin
        },
        body: JSON.stringify(config)
      });
      if (!res.ok) throw new Error('Falha ao salvar');
      toast('Salvo com sucesso!');
    } catch (e) {
      toast('Erro ao salvar', true);
    }
  }

  // ===== EXPORTAR / IMPORTAR =====
  function exportar() {
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gate-config.json';
    a.click();
  }

  function importar() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          config = JSON.parse(ev.target.result);
          render();
          toast('Importado! Clique em Salvar pra publicar.');
        } catch { toast('JSON inválido', true); }
      };
      reader.readAsText(file);
    };
    inp.click();
  }

  function abrirPublico() {
    window.open('/', '_blank');
  }

  function toast(msg, erro = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (erro ? ' erro' : '');
    setTimeout(() => t.className = 'toast', 2000);
  }

  // ===== AUTO-LOGIN SE JÁ TIVER SENHA NA SESSÃO =====
  const senhaSalva = sessionStorage.getItem('admin_senha');
  if (senhaSalva) {
    senhaAdmin = senhaSalva;
    entrarNoPainel();
  } else {
    document.getElementById('loginBox').style.display = 'block';
  }
</script>
</body>
</html>
